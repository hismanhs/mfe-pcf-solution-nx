[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/remoteEntry.js"
  [headers.values]
    Cache-Control = "public, max-age=60"
